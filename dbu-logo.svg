<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="99" fill="#C8102E"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#fff" stroke-width="1.2"/>

  <defs>
    <path id="topArc" d="M 22,115 A 82,82 0 0,1 178,115"/>
    <path id="bottomArc" d="M 30,100 A 76,76 0 0,0 170,100"/>
  </defs>

  <!-- Decorative top ornament (small crown/fleur shape) -->
  <g transform="translate(100,30)" fill="#fff">
    <ellipse cx="0" cy="0" rx="2" ry="4"/>
    <ellipse cx="-5" cy="2" rx="1.8" ry="3.5" transform="rotate(-25,-5,2)"/>
    <ellipse cx="5" cy="2" rx="1.8" ry="3.5" transform="rotate(25,5,2)"/>
    <ellipse cx="-9" cy="5" rx="1.5" ry="3" transform="rotate(-45,-9,5)"/>
    <ellipse cx="9" cy="5" rx="1.5" ry="3" transform="rotate(45,9,5)"/>
  </g>

  <!-- DANSK curved text -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="16" fill="#fff" letter-spacing="5" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">DANSK</textPath>
  </text>

  <!-- Horizontal decorative lines around DBU -->
  <line x1="28" y1="82" x2="60" y2="82" stroke="#fff" stroke-width="1"/>
  <line x1="140" y1="82" x2="172" y2="82" stroke="#fff" stroke-width="1"/>
  <line x1="28" y1="118" x2="60" y2="118" stroke="#fff" stroke-width="1"/>
  <line x1="140" y1="118" x2="172" y2="118" stroke="#fff" stroke-width="1"/>

  <!-- Small diamond decorations on lines -->
  <polygon points="62,82 65,80 68,82 65,84" fill="#fff"/>
  <polygon points="132,82 135,80 138,82 135,84" fill="#fff"/>
  <polygon points="62,118 65,116 68,118 65,120" fill="#fff"/>
  <polygon points="132,118 135,116 138,118 135,120" fill="#fff"/>

  <!-- Main DBU text -->
  <text x="100" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="52" fill="#fff" letter-spacing="5">DBU</text>

  <!-- Clover / four-leaf decorative element -->
  <g transform="translate(100,132)" fill="#fff">
    <circle cx="0" cy="-3.5" r="3"/>
    <circle cx="-3.5" cy="0" r="3"/>
    <circle cx="3.5" cy="0" r="3"/>
    <circle cx="0" cy="3.5" r="3"/>
    <circle cx="0" cy="0" r="1.5"/>
  </g>

  <!-- 1889 -->
  <text x="100" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="14" fill="#fff" letter-spacing="3">1889</text>

  <!-- BOLDSPIL-UNION curved text -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="13" fill="#fff" letter-spacing="2.5" text-anchor="middle">
    <textPath href="#bottomArc" startOffset="50%">BOLDSPIL-UNION</textPath>
  </text>
</svg>
